<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVPN - اشتراک شما</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;min-height:100vh;overflow-x:hidden}

/* ===== DARK ===== */
body.dark{background:#000;color:#e2e8f0}
body.dark::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(99,102,241,0.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,0.08) 0%,transparent 50%);animation:bgShift 25s ease-in-out infinite;z-index:-1}
body.dark .glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.07);box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.05)}
body.dark .stat{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04)}
body.dark .btn-icon{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#94a3b8}
body.dark .btn-icon:hover{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);color:#818cf8}
body.dark .proto-bar{background:rgba(255,255,255,0.04)}
body.dark .txt-box{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1)}

/* ===== LIGHT ===== */
body.light{background:#f0f2f5;color:#1a1a2e}
body.light::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 0%,rgba(99,102,241,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(168,85,247,0.04) 0%,transparent 50%);animation:bgShift 25s ease-in-out infinite;z-index:-1}
body.light .glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.8);box-shadow:0 8px 32px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.9)}
body.light .stat{background:rgba(255,255,255,0.5);border:1px solid rgba(0,0,0,0.04)}
body.light .btn-icon{background:rgba(0,0,0,0.03);border:1px solid rgba(0,0,0,0.06);color:#64748b}
body.light .btn-icon:hover{background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.2);color:#6366f1}
body.light .proto-bar{background:rgba(0,0,0,0.04)}
body.light .txt-box{background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.08)}

@keyframes bgShift{0%,100%{transform:translate(0,0)}50%{transform:translate(-1%,1%)}}

/* ===== Shared ===== */
.glass{border-radius:24px;transition:all 0.4s}
.txt-box{border-radius:12px;padding:6px 12px;display:inline-block}

.theme-toggle{position:fixed;top:14px;left:14px;z-index:50;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:16px;transition:all 0.3s}
body.dark .theme-toggle{background:rgba(255,255,255,0.06);color:#fbbf24;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px)}
body.light .theme-toggle{background:rgba(0,0,0,0.03);color:#6366f1;border:1px solid rgba(0,0,0,0.06);backdrop-filter:blur(20px)}
.theme-toggle:hover{transform:scale(1.1)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid}
.badge.loading{background:rgba(148,163,184,0.1);color:#94a3b8;border-color:rgba(148,163,184,0.15)}
body.dark .badge.active{background:rgba(16,185,129,0.1);color:#34d399;border-color:rgba(16,185,129,0.2)}
body.light .badge.active{background:rgba(16,185,129,0.08);color:#059669;border-color:rgba(16,185,129,0.15)}
body.dark .badge.error{background:rgba(244,63,94,0.1);color:#fb7185;border-color:rgba(244,63,94,0.2)}
body.light .badge.error{background:rgba(244,63,94,0.08);color:#e11d48;border-color:rgba(244,63,94,0.15)}
.badge .dot{width:6px;height:6px;border-radius:50%}
.badge.loading .dot{background:#94a3b8}
.badge.active .dot{background:#34d399;animation:ping 1.5s infinite}
.badge.error .dot{background:#fb7185}
@keyframes ping{0%{transform:scale(1);opacity:1}75%,100%{transform:scale(2);opacity:0}}

.progress-bg{background:rgba(148,163,184,0.1);border-radius:99px;height:8px;overflow:hidden}
body.light .progress-bg{background:rgba(0,0,0,0.06)}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899);background-size:200% 100%;animation:shimmer 3s ease infinite;transition:width 0.8s}
.progress-fill.warn{background:linear-gradient(90deg,#f59e0b,#f97316);animation:none}
.progress-fill.danger{background:linear-gradient(90deg,#ef4444,#dc2626);animation:none}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.proto-bar{height:5px;border-radius:99px;overflow:hidden}
.proto-fill{height:100%;border-radius:99px;transition:width 0.6s}

.btn-icon{width:36px;height:36px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s}

body.dark .tg-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:16px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.15);color:#818cf8;font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s}
body.dark .tg-btn:hover{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);transform:translateY(-1px)}
body.light .tg-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:16px;background:rgba(99,102,241,0.06);border:1px solid rgba(99,102,241,0.12);color:#4f46e5;font-size:12px;font-weight:600;text-decoration:none;transition:all 0.3s}
body.light .tg-btn:hover{background:rgba(99,102,241,0.1);border-color:rgba(99,102,241,0.2);transform:translateY(-1px)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,#10b981,#059669);color:white;font-weight:700;padding:10px 20px;border-radius:16px;font-size:12px;box-shadow:0 8px 24px rgba(16,185,129,0.4);z-index:100;opacity:0;transition:all 0.3s ease-out}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.qr-box{display:none;justify-content:center;padding-top:16px;margin-top:16px;border-top:1px dashed rgba(148,163,184,0.15)}
.qr-box.show{display:flex}
body.light .qr-box{border-top-color:rgba(0,0,0,0.08)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeUp 0.5s ease-out forwards;opacity:0}

::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
body.dark ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:99px}
body.light ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.08);border-radius:99px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</head>
<body class="dark">
<button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>

<div class="w-full max-w-md mx-auto p-4 sm:p-6 pt-14 sm:pt-16 space-y-4">

<!-- HEADER -->
<div class="glass rounded-3xl p-7 text-center relative overflow-hidden fade-in" style="animation-delay:0s">
<div class="h-[2px] absolute top-0 left-0 w-full bg-gradient-to-r from-transparent via-indigo-500/60 to-transparent rounded-full"></div>
<div class="w-[72px] h-[72px] mx-auto mb-4 rounded-[22px] flex items-center justify-center relative" style="background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);box-shadow:0 8px 24px rgba(99,102,241,0.4)">
<div class="absolute inset-0 rounded-[22px]" style="background:linear-gradient(135deg,rgba(255,255,255,0.2) 0%,transparent 50%)"></div>
<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
</div>
<h1 class="text-lg font-bold mb-1" id="userTitle"><span class="txt-box">اکانت شما</span></h1>
<p class="text-[11px] mb-3" id="statusMsg"><span class="txt-box" style="font-size:11px">در حال دریافت اطلاعات...</span></p>
<span class="badge loading" id="statusBadge"><span class="dot"></span><span id="statusBadgeText">در حال بررسی</span></span>
</div>

<!-- USAGE -->
<div class="glass rounded-3xl p-5 hidden fade-in" id="usageCard">
<div class="flex justify-between items-center text-sm mb-3">
<span class="txt-box"><i class="fas fa-chart-pie ml-1.5 text-indigo-400"></i>حجم مصرف شده</span>
<span class="font-bold" id="usageHeadline"><span class="txt-box">-</span></span>
</div>
<div class="progress-bg mb-4"><div class="progress-fill" id="usageFill" style="width:0%"></div></div>
<div class="grid grid-cols-2 gap-3">
<div class="stat rounded-2xl p-3 text-center">
<div class="text-[10px] mb-1"><span class="txt-box"><i class="fas fa-calendar-days ml-1 text-purple-400"></i>تمدید بعدی</span></div>
<div class="text-[13px] font-semibold" id="renewDate"><span class="txt-box">-</span></div>
</div>
<div class="stat rounded-2xl p-3 text-center">
<div class="text-[10px] mb-1"><span class="txt-box"><i class="fas fa-hourglass-half ml-1 text-pink-400"></i>زمان باقیمانده</span></div>
<div class="text-[13px] font-semibold" id="daysLeft"><span class="txt-box">-</span></div>
</div>
</div>
</div>

<!-- PROTOCOL -->
<div class="glass rounded-3xl p-5 hidden fade-in" id="protoCard" style="animation-delay:0.1s">
<div class="text-[12px] mb-3"><span class="txt-box"><i class="fas fa-shuffle ml-1.5 text-indigo-400"></i>ترکیب پروتکل‌ها</span></div>
<div id="protoBars" class="space-y-2.5"></div>
</div>

<!-- CONFIGS -->
<div class="space-y-3 hidden" id="listWrap">
<div class="flex items-center justify-between px-1 mb-1">
<h2 class="text-[11px] font-bold uppercase tracking-widest"><span class="txt-box">کانفیگ‌ها <span class="mono" id="countBadge">(0)</span></span></h2>
<button id="copyAllBtn" class="text-[11px] text-indigo-400 hover:text-indigo-300 transition-colors flex items-center gap-1"><i class="fas fa-copy"></i>کپی همه</button>
</div>
<div id="list" class="space-y-3"></div>
</div>

<p class="text-center text-[12px] hidden py-12" id="emptyMsg">کانفیگی پیدا نشد.</p>

<!-- FOOTER -->
<div class="text-center pt-2 pb-6 fade-in" style="animation-delay:0.2s">
<p class="text-[11px] mb-3">کند ذهن هستید و نتوانستید وصل شوید ؟</p>
<a href="https://t.me/saweg78" class="tg-btn"><i class="fab fa-telegram text-base"></i>بهتره به داش مهرداد پیام بدی</a>
</div>

</div>

<div class="toast" id="toast"></div>

<script>
let theme=localStorage.getItem('mvpn-theme')||'dark';
document.body.className=theme;
document.getElementById('themeIcon').className=theme==='dark'?'fas fa-sun':'fas fa-moon';
function toggleTheme(){theme=theme==='dark'?'light':'dark';document.body.className=theme;localStorage.setItem('mvpn-theme',theme);document.getElementById('themeIcon').className=theme==='dark'?'fas fa-sun':'fas fa-moon'}

// ---------- element refs ----------
const userTitle      = document.getElementById('userTitle');
const statusMsg      = document.getElementById('statusMsg');
const statusBadge    = document.getElementById('statusBadge');
const usageCard      = document.getElementById('usageCard');
const usageFill      = document.getElementById('usageFill');
const usageHeadline  = document.getElementById('usageHeadline');
const renewDate      = document.getElementById('renewDate');
const daysLeft       = document.getElementById('daysLeft');
const protoCard      = document.getElementById('protoCard');
const protoBars      = document.getElementById('protoBars');
const listWrap       = document.getElementById('listWrap');
const listEl         = document.getElementById('list');
const countBadge     = document.getElementById('countBadge');
const emptyMsg       = document.getElementById('emptyMsg');
const copyAllBtn     = document.getElementById('copyAllBtn');
const toastEl        = document.getElementById('toast');

// ---------- helpers ----------
function showToast(text){toastEl.innerHTML='<i class="fas fa-check-circle ml-1"></i> '+text;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}

function setBadge(state,text){
const c={loading:'loading',active:'active',error:'error'};
statusBadge.className='badge '+(c[state]||'loading');
statusBadge.innerHTML=`<span class="dot"></span><span>${text}</span>`;
}

function setStatus(text){statusMsg.innerHTML='<span class="txt-box" style="font-size:11px">'+text+'</span>'}

function b64decode(str){str=str.trim().replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';try{return decodeURIComponent(escape(atob(str)))}catch(e){try{return atob(str)}catch(e2){return''}}}

function fmtBytes(bytes){if(!isFinite(bytes)||bytes<0)return'-';const units=['B','KB','MB','GB','TB'];let i=0,v=bytes;while(v>=1024&&i<units.length-1){v/=1024;i++}return v.toFixed(v>=10?0:1)+' '+units[i]}

const persianDigits=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){return String(n).replace(/[0-9]/g,d=>persianDigits[d])}

function toJalali(gy,gm,gd){const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy<=1600){jy=0;gy-=621}else{jy=979;gy-=1600}const gy2=(gm>2)?(gy+1):gy;let days=(365*gy)+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g_d_m[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);const jd=1+((days<186)?(days%31):((days-186)%30));return[jy,jm,jd]}

function fmtJalaliDate(unixSeconds){const d=new Date(unixSeconds*1000);const[jy,jm,jd]=toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());return toFa(`${jy}/${String(jm).padStart(2,'0')}/${String(jd).padStart(2,'0')}`)}

// ---------- usage / expiry ----------
function renderUsageInfo(headerStr){
if(!headerStr){usageCard.classList.add('hidden');return}
const parts={};headerStr.split(';').forEach(p=>{const[k,v]=p.trim().split('=');if(k&&v!==undefined)parts[k.trim()]=parseInt(v.trim(),10)});
const used=(parts.upload||0)+(parts.download||0),total=parts.total||0,expire=parts.expire||0;
usageCard.classList.remove('hidden');
if(total>0){const pct=Math.min(100,(used/total)*100);usageFill.style.width=pct+'%';usageFill.className='progress-fill'+(pct>90?' danger':pct>70?' warn':'');usageHeadline.innerHTML=`<span class="txt-box">${fmtBytes(used)}</span> <span class="text-[11px] txt-box">از ${fmtBytes(total)}</span>`}
else if(used>0){usageFill.style.width='100%';usageFill.className='progress-fill';usageHeadline.innerHTML=`<span class="txt-box">${fmtBytes(used)}</span> <span class="text-[11px] txt-box">نامحدود</span>`}
else{usageFill.style.width='0%';usageFill.className='progress-fill';usageHeadline.innerHTML='<span class="txt-box">بدون مصرف</span>'}
if(expire>0){const now=Math.floor(Date.now()/1000);const days=Math.max(0,Math.ceil((expire-now)/86400));daysLeft.innerHTML='<span class="txt-box">'+toFa(days)+' روز</span>';renewDate.innerHTML='<span class="txt-box">'+fmtJalaliDate(expire)+'</span>'}
else{daysLeft.innerHTML='<span class="txt-box">نامحدود</span>';renewDate.innerHTML='<span class="txt-box">نامحدود</span>'}
}

// ---------- protocol parsing ----------
function detectProto(uri){if(uri.startsWith('vless://'))return{key:'vless',label:'VLESS',icon:'fa-bolt',color:'#818cf8'};if(uri.startsWith('vmess://'))return{key:'vmess',label:'VMESS',icon:'fa-shuffle',color:'#c084fc'};if(uri.startsWith('trojan://'))return{key:'trojan',label:'TROJAN',icon:'fa-mask',color:'#f472b6'};if(uri.startsWith('ss://'))return{key:'ss',label:'SS',icon:'fa-lock',color:'#38bdf8'};if(uri.startsWith('hysteria2://')||uri.startsWith('hy2://'))return{key:'hy2',label:'HY2',icon:'fa-cloud',color:'#34d399'};if(uri.startsWith('tuic://'))return{key:'tuic',label:'TUIC',icon:'fa-satellite-dish',color:'#fbbf24'};return{key:'other',label:'UNK',icon:'fa-link',color:'#94a3b8'}}

function parseEntry(uri){
const proto=detectProto(uri);let name=proto.label,subtitle='';
try{if(proto.key==='vmess'){const json=JSON.parse(b64decode(uri.replace('vmess://','')));name=json.ps||proto.label;subtitle=`${json.add||'-'}:${json.port||'-'} · ${json.net||'tcp'}`}
else{const hashIdx=uri.indexOf('#');if(hashIdx>-1)name=decodeURIComponent(uri.slice(hashIdx+1))||proto.label;const body=uri.split('://')[1]||'';const beforeHash=body.split('#')[0];const[userAndHost,queryStr]=beforeHash.split('?');const afterAt=userAndHost.includes('@')?userAndHost.split('@')[1]:userAndHost;const[host,port]=afterAt.split(':');const qs=new URLSearchParams(queryStr||'');subtitle=`${host||'-'}:${port||'-'} · ${qs.get('type')||'tcp'}`}}catch(e){}
return{uri,proto,name,subtitle}
}

// ---------- render ----------
function renderProtoBreakdown(entries){
const counts={};entries.forEach(e=>{counts[e.proto.key]=(counts[e.proto.key]||0)+1});const keys=Object.keys(counts);protoBars.innerHTML='';
if(keys.length===0){protoCard.classList.add('hidden');return}protoCard.classList.remove('hidden');
const max=Math.max(...Object.values(counts));
keys.forEach(k=>{const sample=entries.find(e=>e.proto.key===k).proto;const row=document.createElement('div');row.className='flex items-center gap-3 text-[12px]';
row.innerHTML=`<span class="w-[72px] flex-shrink-0 font-bold mono" style="color:${sample.color}">${sample.label}</span><div class="flex-1 proto-bar"><div class="proto-fill" style="width:${(counts[k]/max*100)}%;background:${sample.color}"></div></div><span class="mono w-5 text-left">${toFa(counts[k])}</span>`;
protoBars.appendChild(row)})
}

function renderEntries(rawText){
listEl.innerHTML='';const lines=rawText.split(/\r?\n/).map(l=>l.trim()).filter(l=>/^[a-z0-9]+:\/\//i.test(l));
if(lines.length===0){listWrap.classList.add('hidden');emptyMsg.classList.remove('hidden');setBadge('error','کانفیگی یافت نشد');return}
emptyMsg.classList.add('hidden');listWrap.classList.remove('hidden');setStatus('اطلاعات اشتراک با موفقیت دریافت شد.');setBadge('active','فعال ✓');
const entries=lines.map(parseEntry);countBadge.textContent=`(${toFa(entries.length)})`;renderProtoBreakdown(entries);
if(entries.length&&entries[0].name)userTitle.innerHTML='<span class="txt-box">'+entries[0].name+'</span>';
entries.forEach((entry,idx)=>{const card=document.createElement('div');card.className='glass rounded-2xl p-4 fade-in';
card.innerHTML=`<div class="flex items-center justify-between"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${entry.proto.color}18;color:${entry.proto.color}"><i class="fas ${entry.proto.icon} text-lg"></i></div><div class="min-w-0"><div class="text-[13px] font-semibold truncate"><span class="txt-box">${entry.name}</span></div><div class="text-[10px] mono truncate"><span class="txt-box">${entry.subtitle}</span></div></div></div><div class="flex items-center gap-1.5 flex-shrink-0"><button class="btn-icon qr-t"><i class="fas fa-qrcode text-[13px]"></i></button><button class="btn-icon cp-o"><i class="fas fa-copy text-[13px]"></i></button></div></div><div class="qr-box" id="qr-${idx}"><div class="p-2 bg-white rounded-xl" id="qr-c-${idx}"></div></div>`;
listEl.appendChild(card);
card.querySelector('.cp-o').onclick=()=>navigator.clipboard.writeText(entry.uri).then(()=>showToast('کپی شد ✓'));
card.querySelector('.qr-t').onclick=()=>{const q=card.querySelector('.qr-box');const showing=q.classList.contains('show');q.classList.toggle('show',!showing);const holder=card.querySelector(`#qr-c-${idx}`);if(!showing&&holder.childElementCount===0)new QRCode(holder,{text:entry.uri,width:140,height:140,colorDark:'#0B0E13',colorLight:'#ffffff'})}
})}
copyAllBtn.onclick=()=>navigator.clipboard.writeText(window.__rawSub||'').then(()=>showToast('همه کپی شد ✓'));

// ---------- fetch ----------
async function loadFromServer(idOrUrl){let url=idOrUrl;if(!/^https?:\/\//i.test(idOrUrl)){const cleanId=idOrUrl.replace(/^\/+/,'').replace(/^(sub|rawsub|view)\//,'');url='/rawsub/'+cleanId}const res=await fetch(url);if(!res.ok)throw new Error('fetch failed');renderUsageInfo(res.headers.get('subscription-userinfo'));const raw=await res.text();let decoded=raw;if(!/:\/\//.test(raw))decoded=b64decode(raw);window.__rawSub=decoded;renderEntries(decoded)}

// ---------- init ----------
(function init(){const params=new URLSearchParams(window.location.search);let presetSub=params.get('sub')||params.get('id');if(!presetSub){const m=window.location.pathname.match(/\/sub\/([^\/?#]+)/);if(m)presetSub=m[1]}
if(presetSub){setStatus('صبر کنید...');setBadge('loading','در حال بررسی');loadFromServer(presetSub).catch(()=>{setStatus('دریافت ناموفق. لینک را دوباره امتحان کنید.');setBadge('error','خطا')})}
else{setStatus('لینک اشتراک معتبر نیست.');setBadge('error','نامعتبر')}})();
</script>
</body>
</html>
